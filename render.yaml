# Render Blueprint — HireTrack backend (FastAPI)
# Secrets are NOT stored here. Set the "sync: false" values in the Render dashboard,
# and upload firebase_credentials.json as a Secret File (mounted at /etc/secrets/).
services:
  - type: web
    name: hr-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: FIREBASE_CREDENTIALS_PATH
        value: /etc/secrets/firebase_credentials.json
      - key: GEMINI_API_KEY
        sync: false
      # Your Vercel URL(s), comma-separated, e.g. https://hiretrack.vercel.app
      # (localhost:5173 is always allowed for local development)
      - key: CORS_ORIGINS
        sync: false
      # SMS codes for password reset. "console" only logs the code (no real SMS);
      # switch to "twilio" and fill the TWILIO_* values to send real messages.
      - key: SMS_PROVIDER
        value: console
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
